# This machine has 7.7 GB of RAM total. The Flutter template's default of
# -Xmx8G asks the Gradle daemon for a heap larger than physical memory, so the
# OS pages the daemon to disk while the emulator and Android Studio compete for
# what is left. 2 GB is ample for this project and keeps everything resident.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Reuse the daemon and build independent modules in parallel.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Kotlin incremental compiler keeps memory-mapped cache files that fail on a
# Google Drive path and cannot relativize paths between the pub cache on C: and
# a project on G:. Turning incremental compilation off avoids that machinery
# entirely, at the cost of slightly slower rebuilds.
kotlin.incremental=false
