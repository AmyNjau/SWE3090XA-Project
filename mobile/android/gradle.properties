# The Flutter template asks for -Xmx8G, which exceeds physical memory on a
# modest development machine: the daemon is then paged to disk while the
# emulator and the IDE compete for what is left. 2 GB is ample for this project
# and keeps everything resident.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# Reuse the daemon and build independent modules in parallel.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The Kotlin incremental compiler keeps memory-mapped cache files, which fail on
# a synced cloud-drive path, and it cannot compute relative paths when the pub
# cache and the project sit on different drives. Turning incremental compilation
# off avoids that machinery entirely, at the cost of slightly slower rebuilds.
kotlin.incremental=false
