<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Smart Health — Defence Presentation · Amy Njau · SWE3090XA</title>
<style>
  :root{
    --navy:#14315e; --navy-2:#1e3a6e; --blue:#2563eb; --blue-soft:#eef4ff;
    --ink:#0f172a; --muted:#5b6b82; --line:#e4eaf2; --bg:#f4f7fc;
    --red:#e2483d; --amber:#f59e0b; --green:#16a34a;
    --card:#ffffff; --radius:18px;
    --shadow:0 18px 50px -18px rgba(20,49,94,.35);
    --notes-h:34vh;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Stage ---------- */
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:34px 56px 70px;}
  .slide{
    position:absolute;width:min(1180px,94vw);height:min(680px,82vh);
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:52px 60px;opacity:0;transform:translateY(18px) scale(.985);
    transition:opacity .45s ease,transform .45s ease;pointer-events:none;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .slide.active{opacity:1;transform:none;pointer-events:auto;z-index:2;}
  .slide.prev{opacity:0;transform:translateY(-14px) scale(.985);}

  /* ---------- Type ---------- */
  .kicker{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .kicker::before{content:"";width:26px;height:3px;border-radius:3px;background:var(--blue);}
  h1{font-size:44px;line-height:1.08;letter-spacing:-.02em;margin-bottom:10px;}
  h2{font-size:33px;line-height:1.12;letter-spacing:-.015em;margin-bottom:6px;}
  h3{font-size:19px;line-height:1.25;}
  p{font-size:17.5px;line-height:1.55;color:#26364d;}
  .lede{font-size:20px;color:var(--muted);line-height:1.5;}
  .muted{color:var(--muted);}
  b,strong{color:var(--ink);font-weight:700;}

  /* ---------- Layout helpers ---------- */
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;height:100%;}
  .cols.wide-right{grid-template-columns:.9fr 1.1fr;}
  .cols.wide-left{grid-template-columns:1.15fr .85fr;}
  .cols>*{min-width:0;}
  .stack{display:flex;flex-direction:column;gap:14px;justify-content:center;}
  ul.clean{list-style:none;display:flex;flex-direction:column;gap:13px;}
  ul.clean li{position:relative;padding-left:30px;font-size:17.5px;line-height:1.45;color:#26364d;}
  ul.clean li::before{content:"";position:absolute;left:0;top:8px;width:14px;height:14px;border-radius:5px;background:var(--blue-soft);border:2px solid var(--blue);}
  ul.clean li b{color:var(--ink);}

  .pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px;}
  .pill{background:var(--blue-soft);color:var(--navy);border:1px solid #d6e2fb;padding:7px 13px;border-radius:999px;font-size:14px;font-weight:600;}

  /* device frame */
  .device{position:relative;margin:0 auto;width:262px;border-radius:34px;padding:9px;background:linear-gradient(160deg,#22375f,#0f213f);box-shadow:0 26px 60px -20px rgba(15,33,63,.6);}
  .device img{display:block;width:100%;border-radius:26px;}
  .device.small{width:220px;}
  .figframe{background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 10px 30px -18px rgba(20,49,94,.4);}
  .figframe img{display:block;width:100%;border-radius:6px;}

  .cards{display:grid;gap:14px;}
  .card{background:#fbfcff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;}
  .card h3{margin-bottom:4px;}
  .card p{font-size:15px;color:var(--muted);line-height:1.4;}
  .card .ico{font-size:22px;margin-bottom:8px;display:block;}

  table{width:100%;border-collapse:collapse;font-size:15.5px;}
  th{text-align:left;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:0 12px 10px;border-bottom:2px solid var(--line);}
  td{padding:11px 12px;border-bottom:1px solid var(--line);color:#2a3a52;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .ok{color:var(--green);font-weight:700;}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:#e9f7ee;color:var(--green);}
  .tag.get{background:#eef4ff;color:var(--blue);} .tag.post{background:#e9f7ee;color:var(--green);}
  .mono{font-family:"Cascadia Code",Consolas,monospace;background:#eef4ff;color:#14315e;padding:2px 9px;border-radius:6px;font-size:14.5px;font-weight:600;}

  .stat-row{display:flex;gap:20px;flex-wrap:wrap;}
  .stat{flex:1;min-width:120px;background:linear-gradient(160deg,#fbfcff,#eef4ff);border:1px solid #dfe8fb;border-radius:14px;padding:18px 20px;}
  .stat .n{font-size:38px;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1;}
  .stat .l{font-size:14px;color:var(--muted);margin-top:6px;}

  code{font-family:"Cascadia Code",Consolas,monospace;background:#0f213f;color:#d7e6ff;border-radius:12px;display:block;padding:18px 20px;font-size:14px;line-height:1.6;white-space:pre;overflow:auto;min-width:0;max-width:100%;}
  code .k{color:#7cc4ff;} code .s{color:#8be2b0;} code .c{color:#6b84a8;}

  /* ---------- Title slide ---------- */
  .title-slide{background:linear-gradient(150deg,var(--navy) 0%,#1c3f78 55%,var(--blue) 130%);color:#fff;}
  .title-slide .kicker{color:#9dc0ff;} .title-slide .kicker::before{background:#9dc0ff;}
  .title-slide h1{font-size:52px;color:#fff;}
  .title-slide p{color:#d6e2f7;}
  .title-slide .meta{display:flex;gap:38px;flex-wrap:wrap;margin-top:26px;}
  .title-slide .meta div{border-left:2px solid rgba(255,255,255,.3);padding-left:14px;}
  .title-slide .meta .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9dc0ff;}
  .title-slide .meta .val{font-size:17px;font-weight:600;color:#fff;margin-top:2px;}
  .badge-live{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#eaf1ff;padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:600;}
  .badge-live .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.7);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(74,222,128,.6)}70%{box-shadow:0 0 0 12px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}

  /* section divider slide */
  .divider{background:linear-gradient(150deg,var(--navy),#1f477f);color:#fff;justify-content:center;}
  .divider .kicker{color:#9dc0ff}.divider .kicker::before{background:#9dc0ff}
  .divider h1{color:#fff;font-size:46px;}
  .divider p{color:#cddcf5;max-width:640px;}
  .divider .num{font-size:120px;font-weight:800;color:rgba(255,255,255,.12);position:absolute;top:24px;right:48px;line-height:1;}

  /* speaker notes */
  #notes{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0f213f;color:#dbe6f7;
    border-top:3px solid var(--blue);padding:16px 26px 18px;transform:translateY(102%);transition:transform .3s ease;height:var(--notes-h);overflow:auto;}
  #notes.show{transform:none;}
  /* When notes are open, reserve space so the panel never overlaps slides or chrome. */
  body.notes-open #stage{align-items:flex-start;padding-bottom:calc(var(--notes-h) + 26px);}
  body.notes-open .slide{height:auto;max-height:calc(100vh - var(--notes-h) - 58px);max-height:calc(100dvh - var(--notes-h) - 58px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
  body.notes-open #hud{bottom:calc(var(--notes-h) + 12px);}
  body.notes-open #hint{display:none;}
  #notes h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#7cc4ff;margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  #notes .say{font-size:16.5px;line-height:1.6;color:#eaf1ff;}
  #notes .say b{color:#fff;}
  #notes .mark{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:14.5px;color:#a9c4ea;}
  #notes .mark b{color:#ffd66b;}

  /* chrome */
  #bar{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--blue),#60a5fa);z-index:50;transition:width .4s ease;}
  #hud{position:fixed;bottom:16px;right:22px;z-index:45;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);}
  #hud .btns{display:flex;gap:6px;}
  #hud button{border:1px solid var(--line);background:#fff;color:var(--navy);width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer;box-shadow:0 4px 12px -6px rgba(20,49,94,.4);}
  #hud button:hover{background:var(--blue-soft);}
  #hud #notesBtn{width:auto;padding:0 12px;height:34px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  #hud #notesBtn.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  #hud .count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--navy);}
  #hint{position:fixed;bottom:18px;left:22px;z-index:45;font-size:12.5px;color:var(--muted);}
  #hint kbd{background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:12px;color:var(--navy);}
  .foot{position:absolute;bottom:18px;left:60px;font-size:12.5px;color:#9fb0c6;letter-spacing:.02em;}
  .foot b{color:var(--navy);}

  /* ---------- Phones (portrait) ---------- */
  @media (max-width:820px){
    :root{--notes-h:56vh;}
    #stage{padding:10px 8px 72px;align-items:center;}
    .slide{position:absolute;width:100%;height:auto;max-height:calc(100dvh - 82px);
      overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:22px 18px;border-radius:16px;}
    .body{justify-content:flex-start;}
    .cols,.cols.wide-right,.cols.wide-left{grid-template-columns:1fr;gap:16px;}
    .cards{grid-template-columns:1fr !important;gap:11px;}
    .kicker{font-size:11px;margin-bottom:10px;}
    h1{font-size:29px;} .title-slide h1{font-size:33px;}
    h2{font-size:23px;} h3{font-size:16.5px;}
    p{font-size:15.5px;} .lede{font-size:16.5px;}
    ul.clean{gap:11px;} ul.clean li{font-size:15px;padding-left:26px;}
    ul.clean li::before{top:6px;width:12px;height:12px;}
    .pill{font-size:12.5px;padding:6px 11px;}
    .stat-row{gap:11px;} .stat{padding:14px 15px;} .stat .n{font-size:29px;}
    .card{padding:13px 14px;} .card p{font-size:14px;} .card .ico{font-size:19px;}
    .device{width:172px;} .device.small{width:140px;}
    .figframe{padding:9px;}
    table{font-size:13px;} th{font-size:11px;padding:0 7px 8px;} td{padding:8px 7px;}
    code{font-size:11.5px;padding:13px 13px;line-height:1.55;}
    .divider{justify-content:center;} .divider .num{font-size:64px;top:12px;right:16px;}
    .divider h1{font-size:30px;}
    .title-slide .meta{gap:16px;margin-top:18px;} .title-slide .meta .val{font-size:15px;}
    .foot{position:static;margin-top:14px;left:auto;bottom:auto;}
    #hint{display:none;}
    #hud{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));justify-content:space-between;
      background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border:1px solid var(--line);
      border-radius:13px;padding:7px 10px;box-shadow:0 8px 22px -10px rgba(20,49,94,.4);}
    #hud button{width:42px;height:42px;font-size:20px;}
    #hud #notesBtn{height:42px;padding:0 14px;font-size:13.5px;}
    #notes{padding:14px 18px calc(20px + env(safe-area-inset-bottom));}
    #notes .say{font-size:15px;} #notes .mark{font-size:13.5px;}
  }
  /* ---------- Very small phones ---------- */
  @media (max-width:380px){
    .device{width:150px;} .device.small{width:124px;}
    h1{font-size:26px;} h2{font-size:21px;} .title-slide h1{font-size:30px;}
    .slide{padding:20px 15px;}
  }
  /* ---------- Phones (landscape) ---------- */
  @media (max-height:480px) and (orientation:landscape){
    #stage{padding:8px 40px 60px;}
    .slide{height:auto;max-height:calc(100dvh - 66px);overflow-y:auto;}
    #hint{display:none;}
    #hud{bottom:calc(8px + env(safe-area-inset-bottom));}
  }
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>

<div id="notes">
  <h4>🎤 Presenter script &amp; scoring cues <span style="color:#6b84a8;font-weight:500;text-transform:none;letter-spacing:0">— press <b style="color:#7cc4ff">S</b> to hide</span></h4>
  <div class="say" id="note-say"></div>
  <div class="mark" id="note-mark"></div>
</div>

<div id="hud">
  <button id="notesBtn" title="Speaker notes (S)" aria-pressed="true">📝 Notes</button>
  <span class="count"><span id="cur">1</span> / <span id="tot">0</span></span>
  <div class="btns">
    <button id="prev" title="Previous (←)">‹</button>
    <button id="next" title="Next (→)">›</button>
  </div>
</div>
<div id="hint"><kbd>←</kbd> <kbd>→</kbd> navigate &nbsp;·&nbsp; <kbd>S</kbd> speaker notes &nbsp;·&nbsp; <kbd>F</kbd> fullscreen</div>

<script>
const A = "./assets/";
const slides = [
/* 0 — TITLE */
{
  html:`<div class="slide title-slide">
    <div class="body">
      <div class="kicker">USIU-Africa · SWE3090XA — Software Engineering Final Project</div>
      <h1>Smart Health</h1>
      <p class="lede" style="color:#e6eefb;max-width:720px">A symptom checker &amp; doctor-recommendation system that turns how you feel into a ranked, <b style="color:#fff">explainable</b> shortlist of conditions, the right specialist, and nearby care.</p>
      <div class="meta">
        <div><div class="lbl">Presented by</div><div class="val">Amy Wanjugu Njau · ID 669008</div></div>
        <div><div class="lbl">Supervisor</div><div class="val">Mr Fredrick Ogore</div></div>
        <div><div class="lbl">Deliverable</div><div class="val">System Integration Report + Live Build</div></div>
      </div>
      <div style="margin-top:28px"><span class="badge-live"><span class="dot"></span> Live demo running — backend + Android app up now</span></div>
    </div>
  </div>`,
  say:`Open with confidence and eye contact. <b>"Good morning. I'm Amy Njau, and this is Smart Health — a mobile symptom checker that gives people a ranked, explainable shortlist of likely conditions, points them to the right specialist, and finds nearby care."</b> Then set expectations: <b>"I'll walk through the problem, the architecture, show it running live on the emulator, and cover my testing and results."</b>`,
  mark:`<b>Maximum-marks cue:</b> Say the words the rubric rewards in the first 30 seconds — <b>"integration", "explainable", "layered architecture", "tested end-to-end"</b>. Point at the green "live demo running" badge so the panel knows this is a working build, not slideware.`
},
/* 1 — PROBLEM */
{
  html:`<div class="slide">
    <div class="kicker">The problem</div>
    <div class="body"><div class="cols">
      <div class="stack">
        <h2>People self-diagnose in the dark.</h2>
        <p>When symptoms appear, most people either panic-search the web and get a wall of unranked, unexplained results — or delay care and see the wrong specialist.</p>
        <ul class="clean">
          <li><b>No ranking</b> — everything looks equally scary.</li>
          <li><b>No reasoning</b> — you can't see <i>why</i> a result was suggested.</li>
          <li><b>No next step</b> — which specialist? which nearby clinic?</li>
        </ul>
      </div>
      <div class="cards">
        <div class="card"><span class="ico">🔎</span><h3>Symptom → probable condition</h3><p>Ranked by how closely it matches what you actually reported.</p></div>
        <div class="card"><span class="ico">👩‍⚕️</span><h3>Condition → right specialist</h3><p>The correct point of contact, not a guess.</p></div>
        <div class="card"><span class="ico">📍</span><h3>Specialist → nearby care</h3><p>Reachable providers, sorted by distance.</p></div>
      </div>
    </div></div>
    <div class="foot"><b>Smart Health</b> · guidance tool, not a medical device</div>
  </div>`,
  say:`Frame the pain before the solution. <b>"When something feels wrong, people search the internet and get a wall of results that are unranked, unexplained, and give no next step."</b> Then land the three-step promise on the right: <b>"Smart Health closes that loop — symptom to condition, condition to specialist, specialist to a clinic you can actually reach."</b>`,
  mark:`<b>Maximum-marks cue:</b> Name your scope boundary out loud — <b>"a guidance tool, not a medical device, on an educational knowledge base."</b> Examiners reward a candidate who states limitations before being asked.`
},
/* 2 — SOLUTION / WHAT I BUILT */
{
  html:`<div class="slide">
    <div class="kicker">What I built</div>
    <div class="body"><div class="cols wide-right">
      <div class="stack">
        <h2>One smooth flow across five subsystems.</h2>
        <p>A cross-platform Flutter app backed by a Node.js/Express API that hosts an <b>explainable rule-based engine</b>, a swappable data layer, and server-side location lookup.</p>
        <div class="stat-row" style="margin-top:6px">
          <div class="stat"><div class="n">15</div><div class="l">conditions · 35 symptoms</div></div>
          <div class="stat"><div class="n">9</div><div class="l">specialist types mapped</div></div>
          <div class="stat"><div class="n">15</div><div class="l">automated tests passing</div></div>
        </div>
        <div class="pills"><span class="pill">Flutter / Dart</span><span class="pill">Node.js + Express</span><span class="pill">REST / JSON over HTTPS</span><span class="pill">Firestore-ready</span><span class="pill">Maps-ready</span></div>
      </div>
      <div class="device"><img src="${A}app_home.png" alt="Smart Health home dashboard"/></div>
    </div></div>
  </div>`,
  say:`This is your "here's the product" moment. <b>"I built a working cross-platform app on a real backend — not mock-ups. Fourteen conditions, nine specialists, fifteen automated tests passing."</b> Gesture to the phone: <b>"Clean tabbed home — Check, History, Profile — with the safety disclaimer visible at all times."</b>`,
  mark:`<b>Maximum-marks cue:</b> Emphasise <b>"swappable"</b> — local JSON and mock providers sit behind clean interfaces so Firestore and Google Maps drop in without touching the engine, route, or UI. That's the design-quality mark.`
},
/* 3 — TECH STACK */
{
  html:`<div class="slide">
    <div class="kicker">Technology stack · end to end</div>
    <div class="body">
      <h2 style="margin-bottom:16px">What it's built with — and why those choices.</h2>
      <div class="cards" style="grid-template-columns:1fr 1fr 1fr;gap:14px">
        <div class="card"><span class="ico">📱</span><h3>Presentation tier</h3>
          <p><b>Flutter 3.10+ / Dart 3</b> · Material 3, Android-first.<br><b>http</b> (REST), <b>geolocator 11</b> (location), <b>url_launcher</b> (Maps hand-off).<br>Shared theme · typed models · lightweight in-app state store.</p></div>
        <div class="card"><span class="ico">⚙️</span><h3>Application tier</h3>
          <p><b>Node.js 18+ · Express 4.19</b> (CommonJS).<br><b>cors</b>, <b>dotenv</b>, custom validation + error middleware.<br>Pure rule engine · in-memory <b>TTL cache</b> for provider lookups.</p></div>
        <div class="card"><span class="ico">🗄️</span><h3>Data &amp; external</h3>
          <p>Local JSON store now → <b>Firebase Firestore-ready</b>.<br>Mock providers now → <b>Google Maps Platform</b> Nearby Search-ready.<br>Haversine distance util · anonymised query logs.</p></div>
      </div>
      <div class="pills" style="margin-top:16px">
        <span class="pill">REST / JSON over HTTPS</span><span class="pill">Git &amp; GitHub</span><span class="pill">Postman</span><span class="pill">node:test runner</span><span class="pill">flutter_lints</span><span class="pill">Android emulator</span>
      </div>
    </div>
  </div>`,
  say:`Give a reason with every technology — don't just list. <b>"Flutter for one codebase across platforms; Node and Express because the API is just stateless JSON orchestration; and a rule engine rather than a heavy framework because the logic must stay transparent. The data and Maps layers are deliberately swappable — local JSON and mock providers today, Firestore and Google Maps behind the same interfaces tomorrow."</b>`,
  mark:`<b>Maximum-marks cue:</b> Examiners reward <b>justified</b> tool choices over name-dropping. Pair each layer with its rationale, and stress <b>"the same REST/JSON contract binds all three tiers"</b> — that's the integration story your report is graded on.`
},
/* 4 — OBJECTIVES */
{
  html:`<div class="slide">
    <div class="kicker">Objectives achieved through integration</div>
    <div class="body">
      <h2 style="margin-bottom:22px">What the integration set out to prove.</h2>
      <div class="cards" style="grid-template-columns:1fr 1fr;gap:16px">
        <div class="card"><span class="ico">🔗</span><h3>One end-to-end workflow</h3><p>Symptom input → diagnosis → specialist → nearby-provider lookup, with no manual hand-offs.</p></div>
        <div class="card"><span class="ico">📦</span><h3>Consistent, typed data exchange</h3><p>A single API contract keeps client, server and database on the same well-typed data.</p></div>
        <div class="card"><span class="ico">🛰️</span><h3>Isolated external services</h3><p>Reliable use of location data while the rest of the system is shielded from the Maps provider.</p></div>
        <div class="card"><span class="ico">🛟</span><h3>Graceful degradation</h3><p>One component failing — e.g. denied location — never breaks the whole experience.</p></div>
      </div>
    </div>
  </div>`,

{
  html:`<div class="slide">
    <div class="kicker">Under the hood · the rule engine</div>
    <div class="body"><div class="cols wide-left">
      <div class="stack">
        <h2 style="font-size:27px">Weighted scoring, fully transparent.</h2>
        <p>Each condition holds weighted symptom rules. The engine sums the weights of matched symptoms, normalises to a confidence %, ranks, and maps the top condition to a specialist.</p>
        <ul class="clean">
          <li><b>Deterministic</b> — same input, same output, every time. Easy to test.</li>
          <li><b>Auditable</b> — the matched symptoms <i>are</i> the explanation.</li>
          <li><b>Swappable knowledge base</b> — rules live in data, not code.</li>
        </ul>
      </div>
      <code><span class="c">// POST /api/diagnose  → live response just now</span>
{
  <span class="k">"results"</span>: [
    { <span class="k">"name"</span>:<span class="s">"Malaria"</span>, <span class="k">"confidence"</span>:55,
      <span class="k">"specialist"</span>:<span class="s">"General Physician"</span>,
      <span class="k">"matchedSymptoms"</span>:[<span class="s">"fever"</span>,<span class="s">"headache"</span>,<span class="s">"chills"</span>] },
    { <span class="k">"name"</span>:<span class="s">"Influenza (Flu)"</span>, <span class="k">"confidence"</span>:43.2 },
    { <span class="k">"name"</span>:<span class="s">"Typhoid Fever"</span>, <span class="k">"confidence"</span>:37.1 }
  ]
}</code>
    </div></div>
  </div>`,
  say:`Prove there's real logic behind the UI. <b>"This is the actual JSON the API returned during today's run. The engine is a weighted scorer — it sums matched-symptom weights and normalises to a confidence. Because it's rule-based and deterministic, I can unit-test it exhaustively."</b>`,

/* ---------- engine ---------- */
const stage=document.getElementById('stage');
const noteSay=document.getElementById('note-say');
const noteMark=document.getElementById('note-mark');
const notes=document.getElementById('notes');
let i=0, notesOpen=true;
slides.forEach((s,idx)=>{const w=document.createElement('div');w.innerHTML=s.html;const el=w.firstElementChild;el.dataset.idx=idx;stage.appendChild(el);});
const els=[...stage.children];
document.getElementById('tot').textContent=slides.length;

function render(){
  els.forEach((el,idx)=>{
    el.classList.remove('active','prev');
    if(idx===i)el.classList.add('active');
    else if(idx<i)el.classList.add('prev');
  });
  document.getElementById('cur').textContent=i+1;
  document.getElementById('bar').style.width=((i)/(slides.length-1)*100)+'%';
  noteSay.innerHTML=slides[i].say||'';
  noteMark.innerHTML=slides[i].mark||'';
}
function go(n){i=Math.max(0,Math.min(slides.length-1,n));render();}
function next(){go(i+1);} function prev(){go(i-1);}

const notesBtn=document.getElementById('notesBtn');
function setNotes(open){notesOpen=open;notes.classList.toggle('show',open);notesBtn.classList.toggle('on',open);notesBtn.setAttribute('aria-pressed',open);document.body.classList.toggle('notes-open',open);}
notesBtn.onclick=()=>setNotes(!notesOpen);
document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev();}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(slides.length-1);}
  else if(e.key==='s'||e.key==='S'){setNotes(!notesOpen);}
  else if(e.key==='f'||e.key==='F'){const el=document.documentElement;const rq=el.requestFullscreen||el.webkitRequestFullscreen;if(!document.fullscreenElement&&rq)rq.call(el);else if(document.exitFullscreen)document.exitFullscreen();}
});

// Touch vs pointer: swipe to navigate on touch; click-zones only for mouse users.
const isTouch = matchMedia('(hover: none)').matches || ('ontouchstart' in window);
if(!isTouch){
  stage.addEventListener('click',e=>{ if(e.target.closest('a,button'))return; const r=stage.getBoundingClientRect(); (e.clientX-r.left> r.width*0.5)?next():prev(); });
}
let tsx=0,tsy=0,tst=0;
stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];tsx=t.clientX;tsy=t.clientY;tst=Date.now();},{passive:true});
stage.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-tsx,dy=t.clientY-tsy,dt=Date.now()-tst;
  if(dt<700 && Math.abs(dx)>48 && Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?next():prev(); }
},{passive:true});

// Notes hidden by default so every slide is full and clean; tap 📝 Notes or press S.
setNotes(false);
render();
</script>
</body>
</html>
