<svg viewBox="0 0 720 560" width="100%" role="img" aria-label="Entity relationship diagram showing User, Query, Symptom, Condition, Condition_Symptom, Specialist and Provider" style="font-family:Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aE" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#204098"/>
    </marker>
  </defs>

  <!-- USER -->
  <rect x="14" y="20" width="180" height="96" rx="6" fill="#ffffff" stroke="#204098" stroke-width="1.6"/>
  <rect x="14" y="20" width="180" height="26" rx="6" fill="#204098"/>
  <rect x="14" y="38" width="180" height="8" fill="#204098"/>
  <text x="104" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">USER</text>
  <text x="26" y="64" font-size="10" fill="#201820">user_id (PK)</text>
  <text x="26" y="80" font-size="10" fill="#5B6B82">name</text>
  <text x="26" y="96" font-size="10" fill="#5B6B82">location</text>
  <text x="26" y="112" font-size="10" fill="#5B6B82">created_at</text>

  <!-- QUERY -->
  <rect x="14" y="176" width="180" height="112" rx="6" fill="#ffffff" stroke="#204098" stroke-width="1.6"/>
  <rect x="14" y="176" width="180" height="26" rx="6" fill="#204098"/>
  <rect x="14" y="194" width="180" height="8" fill="#204098"/>
  <text x="104" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">QUERY</text>
  <text x="26" y="220" font-size="10" fill="#201820">query_id (PK)</text>
  <text x="26" y="236" font-size="10" fill="#201820">user_id (FK)</text>
  <text x="26" y="252" font-size="10" fill="#5B6B82">symptoms</text>
  <text x="26" y="268" font-size="10" fill="#5B6B82">result</text>
  <text x="26" y="284" font-size="10" fill="#5B6B82">timestamp</text>

  <line x1="104" y1="120" x2="104" y2="172" stroke="#204098" stroke-width="1.5" marker-end="url(#aE)"/>
  <text x="112" y="150" font-size="10" fill="#5B6B82">1 : M</text>

  <!-- SYMPTOM -->
  <rect x="270" y="20" width="180" height="80" rx="6" fill="#ffffff" stroke="#204098" stroke-width="1.6"/>
  <rect x="270" y="20" width="180" height="26" rx="6" fill="#204098"/>
  <rect x="270" y="38" width="180" height="8" fill="#204098"/>
  <text x="360" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SYMPTOM</text>
  <text x="282" y="64" font-size="10" fill="#201820">symptom_id (PK)</text>
  <text x="282" y="80" font-size="10" fill="#5B6B82">name</text>
  <text x="282" y="96" font-size="10" fill="#5B6B82">category</text>

  <!-- CONDITION_SYMPTOM -->
  <rect x="256" y="176" width="208" height="96" rx="6" fill="#fdf6da" stroke="#F8C808" stroke-width="2.2"/>
  <rect x="256" y="176" width="208" height="26" rx="6" fill="#F8C808"/>
  <rect x="256" y="194" width="208" height="8" fill="#F8C808"/>
  <text x="360" y="194" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#201820">CONDITION_SYMPTOM</text>
  <text x="268" y="220" font-size="10" fill="#201820">condition_id (FK)</text>
  <text x="268" y="236" font-size="10" fill="#201820">symptom_id (FK)</text>
  <text x="268" y="252" font-size="10" font-weight="bold" fill="#201820">weight</text>
  <text x="268" y="267" font-size="9" fill="#5B6B82">the tunable rule value</text>

  <line x1="360" y1="104" x2="360" y2="172" stroke="#204098" stroke-width="1.5" marker-end="url(#aE)"/>
  <text x="368" y="142" font-size="10" fill="#5B6B82">1 : M</text>

  <!-- CONDITION -->
  <rect x="526" y="20" width="180" height="96" rx="6" fill="#ffffff" stroke="#204098" stroke-width="1.6"/>
  <rect x="526" y="20" width="180" height="26" rx="6" fill="#204098"/>
  <rect x="526" y="38" width="180" height="8" fill="#204098"/>
  <text x="616" y="38" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">CONDITION</text>
  <text x="538" y="64" font-size="10" fill="#201820">condition_id (PK)</text>
  <text x="538" y="80" font-size="10" fill="#5B6B82">name</text>
  <text x="538" y="96" font-size="10" fill="#5B6B82">description</text>
  <text x="538" y="112" font-size="10" fill="#5B6B82">severity</text>

  <line x1="616" y1="120" x2="616" y2="196" stroke="#204098" stroke-width="1.5"/>
  <line x1="616" y1="196" x2="468" y2="212" stroke="#204098" stroke-width="1.5" marker-end="url(#aE)"/>
  <text x="560" y="170" font-size="10" fill="#5B6B82">1 : M</text>

  <!-- SPECIALIST -->
  <rect x="526" y="330" width="180" height="80" rx="6" fill="#ffffff" stroke="#204098" stroke-width="1.6"/>
  <rect x="526" y="330" width="180" height="26" rx="6" fill="#204098"/>
  <rect x="526" y="348" width="180" height="8" fill="#204098"/>
  <text x="616" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">SPECIALIST</text>
  <text x="538" y="374" font-size="10" fill="#201820">specialist_id (PK)</text>
  <text x="538" y="390" font-size="10" fill="#5B6B82">type</text>
  <text x="538" y="406" font-size="10" fill="#5B6B82">description</text>

  <line x1="660" y1="120" x2="660" y2="326" stroke="#204098" stroke-width="1.5" marker-end="url(#aE)"/>
  <text x="668" y="230" font-size="10" fill="#5B6B82">M : 1</text>

  <!-- PROVIDER -->
  <rect x="256" y="440" width="208" height="112" rx="6" fill="#ffffff" stroke="#204098" stroke-width="1.6"/>
  <rect x="256" y="440" width="208" height="26" rx="6" fill="#204098"/>
  <rect x="256" y="458" width="208" height="8" fill="#204098"/>
  <text x="360" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PROVIDER</text>
  <text x="268" y="484" font-size="10" fill="#201820">provider_id (PK)</text>
  <text x="268" y="500" font-size="10" fill="#5B6B82">name</text>
  <text x="268" y="516" font-size="10" fill="#5B6B82">specialty</text>
  <text x="268" y="532" font-size="10" fill="#5B6B82">latitude, longitude</text>
  <text x="268" y="548" font-size="10" fill="#5B6B82">rating</text>

  <line x1="526" y1="386" x2="468" y2="470" stroke="#204098" stroke-width="1.5" marker-end="url(#aE)"/>
  <text x="474" y="418" font-size="10" fill="#5B6B82">M : M</text>

  <rect x="14" y="470" width="200" height="52" rx="5" fill="#f6f8fc" stroke="#c9d2e4"/>
  <text x="26" y="490" font-size="10" fill="#5B6B82">PK = primary key</text>
  <text x="26" y="506" font-size="10" fill="#5B6B82">FK = foreign key</text>
</svg>
