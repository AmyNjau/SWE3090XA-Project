<svg viewBox="0 0 720 470" width="100%" role="img" aria-label="Three-tier architecture: Flutter client, Express API with rule engine, and the data and external services tier" style="font-family:Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aA" markerWidth="9" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#204098"/>
    </marker>
  </defs>

  <!-- Presentation tier -->
  <rect x="14" y="14" width="692" height="98" rx="8" fill="#f6f8fc" stroke="#c9d2e4" stroke-width="1.5"/>
  <text x="30" y="38" font-size="11" font-weight="bold" fill="#5B6B82" letter-spacing="1.2">PRESENTATION TIER</text>
  <rect x="230" y="48" width="260" height="50" rx="6" fill="#204098"/>
  <text x="360" y="70" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Flutter Mobile Client</text>
  <text x="360" y="87" text-anchor="middle" font-size="10.5" fill="#dfe5f5">symptom input · results · providers</text>

  <!-- Application tier -->
  <rect x="14" y="150" width="692" height="130" rx="8" fill="#f6f8fc" stroke="#c9d2e4" stroke-width="1.5"/>
  <text x="30" y="174" font-size="11" font-weight="bold" fill="#5B6B82" letter-spacing="1.2">APPLICATION TIER</text>
  <rect x="70" y="188" width="250" height="72" rx="6" fill="#204098"/>
  <text x="195" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Node.js / Express API</text>
  <text x="195" y="234" text-anchor="middle" font-size="10.5" fill="#dfe5f5">REST endpoints</text>
  <text x="195" y="250" text-anchor="middle" font-size="10.5" fill="#dfe5f5">integration mediator</text>

  <rect x="400" y="188" width="250" height="72" rx="6" fill="#283890"/>
  <text x="525" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Rule-Based Engine</text>
  <text x="525" y="234" text-anchor="middle" font-size="10.5" fill="#dfe5f5">weighted scoring</text>
  <text x="525" y="250" text-anchor="middle" font-size="10.5" fill="#dfe5f5">explainable output</text>

  <line x1="324" y1="224" x2="396" y2="224" stroke="#204098" stroke-width="1.5" marker-end="url(#aA)"/>

  <!-- Data tier -->
  <rect x="14" y="318" width="692" height="132" rx="8" fill="#fffdf3" stroke="#F8C808" stroke-width="1.5"/>
  <text x="30" y="342" font-size="11" font-weight="bold" fill="#5B6B82" letter-spacing="1.2">DATA &amp; EXTERNAL SERVICES</text>
  <rect x="70" y="356" width="250" height="72" rx="6" fill="#fdf6da" stroke="#F8C808" stroke-width="2"/>
  <text x="195" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#201820">Data Store</text>
  <text x="195" y="402" text-anchor="middle" font-size="10.5" fill="#5B6B82">rules · specialists · providers</text>
  <text x="195" y="418" text-anchor="middle" font-size="10.5" fill="#5B6B82">anonymised query log</text>

  <rect x="400" y="356" width="250" height="72" rx="6" fill="#fdf6da" stroke="#F8C808" stroke-width="2"/>
  <text x="525" y="384" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#201820">Google Maps Platform</text>
  <text x="525" y="402" text-anchor="middle" font-size="10.5" fill="#5B6B82">nearby provider search</text>
  <text x="525" y="418" text-anchor="middle" font-size="10.5" fill="#5B6B82">called server-side only</text>

  <!-- Cross-tier arrows -->
  <line x1="330" y1="100" x2="215" y2="184" stroke="#204098" stroke-width="1.5" marker-end="url(#aA)"/>
  <text x="268" y="132" text-anchor="end" font-size="10.5" fill="#5B6B82">REST / JSON</text>
  <line x1="240" y1="184" x2="352" y2="102" stroke="#204098" stroke-width="1.5" marker-end="url(#aA)"/>
  <text x="330" y="160" text-anchor="start" font-size="10.5" fill="#5B6B82">ranked results + disclaimer</text>

  <!-- Both outward calls leave the API, never the engine: the engine is pure. -->
  <line x1="150" y1="264" x2="150" y2="352" stroke="#204098" stroke-width="1.5" marker-end="url(#aA)"/>
  <text x="160" y="308" font-size="10.5" fill="#5B6B82">reads rules, writes log</text>
  <path d="M 260 264 L 260 300 L 525 300 L 525 352" fill="none" stroke="#204098" stroke-width="1.5" marker-end="url(#aA)"/>
  <text x="392" y="294" text-anchor="middle" font-size="10.5" fill="#5B6B82">nearby search (server-side)</text>
</svg>
