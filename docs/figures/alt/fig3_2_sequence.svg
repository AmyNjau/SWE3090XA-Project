<svg viewBox="0 0 720 560" width="100%" role="img" aria-label="Sequence diagram of the end-to-end request flow between client, API, engine, data store and Maps Platform" style="font-family:Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aS" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#204098"/>
    </marker>
    <marker id="aSd" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#5B6B82"/>
    </marker>
  </defs>

  <!-- Lifeline heads -->
  <rect x="10" y="12" width="110" height="40" rx="5" fill="#204098"/>
  <text x="65" y="37" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Flutter Client</text>
  <rect x="160" y="12" width="110" height="40" rx="5" fill="#204098"/>
  <text x="215" y="37" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Express API</text>
  <rect x="310" y="12" width="110" height="40" rx="5" fill="#283890"/>
  <text x="365" y="37" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">Rule Engine</text>
  <rect x="460" y="12" width="110" height="40" rx="5" fill="#fdf6da" stroke="#F8C808" stroke-width="2"/>
  <text x="515" y="37" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#201820">Data Store</text>
  <rect x="600" y="12" width="110" height="40" rx="5" fill="#fdf6da" stroke="#F8C808" stroke-width="2"/>
  <text x="655" y="37" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#201820">Maps API</text>

  <!-- Lifelines -->
  <line x1="65" y1="52" x2="65" y2="540" stroke="#c9d2e4" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="215" y1="52" x2="215" y2="540" stroke="#c9d2e4" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="365" y1="52" x2="365" y2="540" stroke="#c9d2e4" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="515" y1="52" x2="515" y2="540" stroke="#c9d2e4" stroke-width="1.5" stroke-dasharray="5 5"/>
  <line x1="655" y1="52" x2="655" y2="540" stroke="#c9d2e4" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 1 -->
  <line x1="65" y1="92" x2="211" y2="92" stroke="#204098" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="138" y="86" text-anchor="middle" font-size="10.5" fill="#201820">1. POST /api/diagnose {symptoms}</text>
  <!-- 2 -->
  <line x1="215" y1="130" x2="361" y2="130" stroke="#204098" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="288" y="124" text-anchor="middle" font-size="10.5" fill="#201820">2. score(symptoms)</text>
  <!-- 3 -->
  <line x1="365" y1="168" x2="511" y2="168" stroke="#204098" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="438" y="162" text-anchor="middle" font-size="10.5" fill="#201820">3. read weighted rules</text>
  <!-- 4 -->
  <line x1="511" y1="200" x2="369" y2="200" stroke="#5B6B82" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#aSd)"/>
  <text x="440" y="194" text-anchor="middle" font-size="10.5" fill="#5B6B82">4. conditions + weights</text>
  <!-- 5 -->
  <line x1="361" y1="238" x2="219" y2="238" stroke="#5B6B82" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#aSd)"/>
  <text x="290" y="232" text-anchor="middle" font-size="10.5" fill="#5B6B82">5. ranked list + specialist</text>
  <!-- 6 -->
  <line x1="215" y1="276" x2="511" y2="276" stroke="#204098" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="360" y="270" text-anchor="middle" font-size="10.5" fill="#201820">6. log query (anonymised)</text>
  <!-- 7 -->
  <line x1="211" y1="314" x2="69" y2="314" stroke="#5B6B82" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#aSd)"/>
  <text x="140" y="308" text-anchor="middle" font-size="10.5" fill="#5B6B82">7. conditions + disclaimer</text>
  <!-- 8 -->
  <line x1="65" y1="366" x2="211" y2="366" stroke="#204098" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="138" y="346" text-anchor="middle" font-size="10.5" fill="#201820">8. POST /api/providers</text>
  <text x="138" y="359" text-anchor="middle" font-size="10" fill="#5B6B82">{specialist, lat, lng}</text>
  <!-- 9 -->
  <line x1="215" y1="410" x2="651" y2="410" stroke="#204098" stroke-width="1.5" marker-end="url(#aS)"/>
  <text x="432" y="404" text-anchor="middle" font-size="10.5" fill="#201820">9. nearby search (server-side, key never leaves the server)</text>
  <!-- 10 -->
  <line x1="651" y1="448" x2="219" y2="448" stroke="#5B6B82" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#aSd)"/>
  <text x="434" y="442" text-anchor="middle" font-size="10.5" fill="#5B6B82">10. nearby places</text>
  <!-- 11 -->
  <line x1="211" y1="490" x2="69" y2="490" stroke="#5B6B82" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#aSd)"/>
  <text x="140" y="484" text-anchor="middle" font-size="10.5" fill="#5B6B82">11. ranked providers</text>

  <rect x="250" y="508" width="300" height="30" rx="4" fill="#f6f8fc" stroke="#c9d2e4"/>
  <text x="400" y="528" text-anchor="middle" font-size="10.5" fill="#5B6B82">Solid = request · dashed = response</text>
</svg>
